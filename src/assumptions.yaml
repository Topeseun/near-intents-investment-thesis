# Assumptions for the NEAR fee-capture DCF (src/model.py).
# ---------------------------------------------------------------------------
# RULE: every model input traces either to a cached API response in data/raw/
# (with source + fetched_at in data/manifest.json) or to a value in this file,
# labelled below as ASSUMPTION. Nothing else is invented.
#
# LIVE INPUTS (from cache, NOT assumed — see src/model.py for extraction):
#   F30            trailing-30d Intents gross fees, USD (DefiLlama near-intents)
#   capture_30d    MEASURED 30D capture rate from revenue.near.org SSR payload
#                  (net revenue $1.95M / gross fees $5.41M, cross-checked
#                  against the per-mechanism split; see BUILD_NOTES.md).
#                  Base-case capture below is therefore a MEASUREMENT, and the
#                  15/25/35% grid is the scenario range around it.
#   price, mcap    CoinGecko /simple/price (NEAR)
#   supply_circ    circulating supply (NEARBlocks /v1/stats)
#   supply_total   total supply (NEARBlocks /v1/stats)
#   max_inflation  2.5% cap (RPC EXPERIMENTAL_protocol_config, [1,40])
#   apy            last-epoch staking APY (NEARBlocks /v1/validators)
#   peer prices/mcaps/fees/TVL: CoinGecko + DefiLlama (see model.py)
#
# ASSUMPTIONS (this file only):
# ---------------------------------------------------------------------------

# Fee-capture DCF — Gordon growth: Value = R₁ / (r - g), R₁ = R₀ * (1 + g)
# R₀ = F30 * 12 * capture  (annualised retained revenue, USD/yr)
dcf:
  # Base-case discount rate (WACC proxy for a crypto protocol cash flow).
  # ASSUMPTION. 15% follows the research-notes §8 base case (r=15%, g=10%).
  base_discount_rate: 0.15
  # Base-case perpetual growth of retained Intents revenue.
  # ASSUMPTION. 10% is deliberately sober vs the 2025-26 realised fee CAGR
  # (computed live from the DefiLlama daily series and reported in
  # metrics.json as fee_cagr_log_regression — compare, don't substitute).
  base_growth_rate: 0.10
  # Sensitivity grid. ASSUMPTION (scenario range, not measurements).
  # The 15/25/35% range is retained from the research spec even though the
  # measured 30D capture is ~36%, so the grid shows the model *below* the
  # measured rate as well as around it; the measured rate is plotted
  # separately as the base case.
  capture_scenarios: [0.15, 0.25, 0.35]
  growth_scenarios: [0.0, 0.10, 0.20]
  discount_scenarios: [0.10, 0.12, 0.15]
  # Heatmap (Chart 7): capture x growth at this fixed discount rate.
  heatmap_discount_rate: 0.12

# Issuance-offset (deflation test). No assumptions: issued/yr =
# max_inflation * total_supply; bought/yr = R₀ / price; break-even retained
# revenue = issued/yr * price. All recomputed live in model.py.
issuance:
  annualisation_months: 12  # F30 (30 days) -> annualised retained revenue

# Benchmark peers (CoinGecko ids / DefiLlama fee slugs, for reference only;
# the pipeline verifies each slug at fetch time and drops 404s).
peers:
  solana: { coingecko_id: "solana", defillama_fee_slug: "solana" }
  avalanche-2: { coingecko_id: "avalanche-2", defillama_fee_slug: "avalanche" }
  ethereum: { coingecko_id: "ethereum", defillama_fee_slug: "ethereum" }
intents_competitors:
  thorchain: { defillama_fee_slug: "thorchain" }
  chainflip: { defillama_fee_slug: "chainflip" }
  debridge: { defillama_fee_slug: "debridge" }
  # lifi: TESTED 2026-11-10, DefiLlama returns "Fees for lifi not found" —
  # dropped from the benchmark. See BUILD_NOTES.md.
